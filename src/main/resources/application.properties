spring.application.name=marketsocial

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/marketsocial}
spring.datasource.username=${DATABASE_USERNAME:marketsocial}
spring.datasource.password=${DATABASE_PASSWORD:marketsocial}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.notifications.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.email.from=${EMAIL_FROM:}
app.notifications.poll-interval-ms=${NOTIFICATION_POLL_INTERVAL_MS:15000}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=32MB

app.media.upload-dir=${MEDIA_UPLOAD_DIR:./uploads}
